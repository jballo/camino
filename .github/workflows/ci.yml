# Backend tests and frontend lint, typecheck and tests on every PR into and push
# to dev and main. Vercel builds the frontend, so there is no `next build` here.
#
# No secrets: the backend tests use synthetic settings (Backend/tests/conftest.py)
# and the frontend checks need no env files. Keep it that way so fork PRs can
# run without access to anything.
#
# No `paths:` filters: these jobs are required checks, and a required check
# skipped by a path filter stays pending forever.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    env:
      # `uv run` inside test_all.sh must use the lockfile as is, never re-resolve.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Match ARG UV_VERSION in Backend/Dockerfile.
          version: "0.12.23"
          python-version: "3.14"
          working-directory: Backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      # Same runner as local pre-merge runs: FastAPI fixture, disposable pgvector
      # container, and TEST_DATABASE_URL so an unreachable database fails the
      # Postgres tests instead of skipping them.
      - name: Test
        run: ./scripts/test_all.sh -ra

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts and the route types are generated, not committed.
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Test
        run: npm test
